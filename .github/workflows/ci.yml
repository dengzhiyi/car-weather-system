name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 静态自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验 App Shell / 引用 / 图标 / CSP
        run: npm run check

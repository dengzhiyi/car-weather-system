name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 构建与产物自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单测（domain 纯规则）
        run: npm test
      - name: 构建
        run: npm run build
      - name: 校验产物（Shell 一致性 / 引用 / CSP）
        run: npm run check:dist
